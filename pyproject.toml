[project]
name = "scitrace-rl"
version = "0.1.0"
description = "Trace, validation, and reward infrastructure for scientific AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SciTrace-RL Demo" }]
license = { text = "MIT" }

[project.scripts]
scitrace-rl = "scitrace_rl.cli:main"
scitrace-rl-eval = "scitrace_rl.eval_suite:main"
scitrace-rl-deep-eval = "scitrace_rl.deep_eval:main"
scitrace-rl-verify = "scitrace_rl.integrity:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
